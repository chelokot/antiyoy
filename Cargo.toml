[workspace]
members = [
    "crates/antiyoy-cli",
    "crates/antiyoy-core",
    "crates/antiyoy-protocol",
    "crates/antiyoy-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Andrii Vlasenko <andrii@oriane.xyz>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chelokot/antiyoy"

[workspace.dependencies]
antiyoy-core = { path = "crates/antiyoy-core" }
antiyoy-protocol = { path = "crates/antiyoy-protocol" }
anyhow = "1.0.99"
clap = { version = "4.5.46", features = ["derive"] }
getrandom = { version = "0.3.3", features = ["wasm_js"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rand = { version = "0.9.2", features = ["small_rng"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
wasm-bindgen = "0.2.100"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1
debug = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

