[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "antiyoy-rl"
version = "0.1.0"
description = "High-throughput vector environments for Antiyoy reinforcement learning"
requires-python = ">=3.11"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
training = ["torch>=2.9", "onnx>=1.22", "onnxruntime>=1.29"]

[tool.maturin]
manifest-path = "../crates/antiyoy-python/Cargo.toml"
python-source = "."
module-name = "antiyoy_rl._native"
features = ["pyo3/extension-module"]
